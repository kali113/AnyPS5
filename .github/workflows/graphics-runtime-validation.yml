name: Graphics runtime diagnostic
on:
  push:
    branches: [validation/graphics-runtime-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libvulkan1 mesa-vulkan-drivers
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: echo 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-store-runtime
          restore-keys: |
            ${{ runner.os }}-
          save: true
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DANYPS5_ENABLE_SPIRV_TOOLS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - run: python3 tools/check_test_registration.py build
      - run: cmake --build build --target agc_driver_graphics_tests --parallel 3
      - name: Four concurrent graphics test processes, three rounds
        run: |
          python3 - <<'PYPROBE'
          import concurrent.futures, json, os, subprocess, time
          from pathlib import Path
          catalog=json.loads(subprocess.check_output(['ctest','--test-dir','build','--show-only=json-v1'],text=True))
          case=next(t for t in catalog['tests'] if t['name']=='agc_driver_graphics')
          props={p['name']:p['value'] for p in case['properties']}
          environment=os.environ.copy()
          for item in props.get('ENVIRONMENT',[]):
              key,value=item.split('=',1)
              environment[key]=value
          for item in props.get('ENVIRONMENT_MODIFICATION',[]):
              key,change=item.split('=',1)
              operation,value=change.split(':',1)
              if operation!='path_list_prepend':raise RuntimeError(operation)
              environment[key]=value+os.pathsep+environment.get(key,'')
          def probe(i):
              started=time.monotonic()
              try:
                  r=subprocess.run(case['command'],cwd=props['WORKING_DIRECTORY'],env=environment,capture_output=True,text=True,timeout=30)
              except subprocess.TimeoutExpired as error:
                  print(f'PROCESS {i} TIMED OUT\n{error.stdout}\n{error.stderr}',flush=True)
                  raise
              print(f'PROCESS {i} seconds={time.monotonic()-started:.3f} exit={r.returncode}\n{r.stdout}\n{r.stderr}',flush=True)
              if r.returncode:raise RuntimeError(f'process {i} failed')
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(probe,range(12)))
          PYPROBE
