name: Clip device probe validation
on:
  push:
    branches: [validation/clip-device-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libvulkan1 mesa-vulkan-drivers
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: echo 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build --target agc_driver_vertex_clip_cull_draw_tests --parallel 3
      - if: runner.os == 'Linux'
        name: Draw through lavapipe
        run: ctest --test-dir build -R '^agc_driver_vertex_clip_cull_draw(_no_key)?$' --output-on-failure --timeout 30 --parallel 4 --output-log clip-positive.log
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          MESA_SHADER_CACHE_DISABLE: 'true'
      - name: Missing device must skip promptly
        run: |
          ctest --test-dir build -R '^agc_driver_vertex_clip_cull_draw(_no_key)?$' --verbose --timeout 30 --parallel 4 --output-log clip-no-device.log
          python3 - <<'PYRESULT'
          from pathlib import Path
          text=Path('clip-no-device.log').read_text()
          if text.count('***Skipped') != 2:
              raise SystemExit('both draw variants must skip without a device')
          PYRESULT
        env:
          VK_ICD_FILENAMES: /nonexistent.json
          VK_DRIVER_FILES: /nonexistent.json
      - if: runner.os == 'Linux'
        name: Required Vulkan must still fail without a device
        run: |
          if ctest --test-dir build -R '^agc_driver_vertex_clip_cull_draw(_no_key)?$' --output-on-failure --timeout 30; then
            echo 'Required Vulkan unexpectedly skipped or passed'
            exit 1
          fi
          if grep -q 'Timeout' build/Testing/Temporary/LastTest.log; then
            exit 1
          fi
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          VK_ICD_FILENAMES: /nonexistent.json
          VK_DRIVER_FILES: /nonexistent.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clip-device-${{ runner.os }}
          path: |
            clip-positive.log
            clip-no-device.log
            build/Testing/Temporary/LastTest.log
