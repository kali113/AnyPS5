name: Store runtime CI configuration validation
on:
  push:
    branches: [validation/store-runtime-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libvulkan1 mesa-vulkan-drivers
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: echo 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-store-runtime
          restore-keys: |
            ${{ runner.os }}-
          save: true
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DANYPS5_ENABLE_SPIRV_TOOLS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - run: python3 tools/check_test_registration.py build
      - run: cmake --build build --target agc_driver_flat_store_tests agc_driver_global_vcc_base_tests --parallel 3
      - name: Exercise the primary case under parallel contention too
        run: |
          python3 - <<'PYSCHEDULE'
          from pathlib import Path
          p=Path('build/core/libs/prx/libSceAgcDriver/CTestTestfile.cmake')
          s=p.read_text().replace('RUN_SERIAL "TRUE"', 'RUN_SERIAL "FALSE"')
          p.write_text(s)
          PYSCHEDULE
      - if: runner.os == 'Linux'
        name: Three cold repetitions with parallel contention
        run: ctest --test-dir build -L '^agc_driver_(flat_store|global_vcc_base)$' --output-on-failure --timeout 30 --parallel 4 --repeat until-fail:3 --output-log cold-store.log
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          MESA_SHADER_CACHE_DISABLE: 'true'
      - if: runner.os == 'Windows'
        name: Windows registered modes and capability checks
        run: ctest --test-dir build -L '^agc_driver_(flat_store|global_vcc_base)$' --output-on-failure --timeout 30 --parallel 4 --output-log cold-store.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: store-runtime-${{ runner.os }}
          path: |
            ctest.log
            cold-store.log
            build/Testing/Temporary/LastTest.log
