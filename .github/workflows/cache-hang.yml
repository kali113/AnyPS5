name: Shader cache Windows hang diagnosis
on:
  push:
    branches: [validation/cache-hang]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache@v6
        id: toolchain
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - name: Add diagnostic phase output
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          p=Path('core/libs/prx/libSceAgcDriver/tests/ShaderDiskCache.cpp')
          s=p.read_text()
          import re
          s=re.sub(r'^(        )(verify\w+\([^;]*;)$', lambda m:m[1]+'std::cerr << "phase: '+m[2].split('(')[0]+'\\n" << std::flush;\n'+m[0],s,flags=re.M)
          p.write_text(s)
          PYTHON
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build --target agc_shader_disk_cache_tests --parallel 4
      - name: Repeated process runs with hang backtrace
        run: |
          export PATH="$PWD/build/core/libs/libs/unpatched:$PATH"
          python - <<'PYTHON'
          import subprocess, time, pathlib, shutil, json
          exe=pathlib.Path('build/tests/agc_shader_disk_cache_tests.exe').resolve()
          for i in range(1000):
              print(f'Run {i+1}/1000',flush=True)
              with open('cache-current.log','w') as log:
                  child=subprocess.Popen([str(exe)],stdout=log,stderr=subprocess.STDOUT)
                  try: result=child.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      print(pathlib.Path('cache-current.log').read_text(),flush=True)
                      debugger=shutil.which('gdb')
                      if debugger:
                          processes=json.loads(subprocess.check_output(['powershell','-NoProfile','-Command','Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name | ConvertTo-Json'],text=True))
                          pending=[child.pid]
                          while pending:
                              pid=pending.pop()
                              pending.extend(int(p['ProcessId']) for p in processes if int(p['ParentProcessId'])==pid)
                              with open(f'cache-backtrace-{pid}.log','w') as bt:
                                  subprocess.run([debugger,'-batch','-p',str(pid),'-ex','thread apply all bt','-ex','detach'],stdout=bt,stderr=subprocess.STDOUT,timeout=30)
                              print(pathlib.Path(f'cache-backtrace-{pid}.log').read_text(),flush=True)
                      child.kill()
                      raise SystemExit('Shader cache hung')
              if result:
                  print(pathlib.Path('cache-current.log').read_text(),flush=True)
                  raise SystemExit(result)
          PYTHON
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cache-hang-diagnostics
          path: cache-*.log
