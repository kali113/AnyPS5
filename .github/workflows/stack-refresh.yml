name: Stack header validation
on:
  push:
    branches: [validation/stack-refresh]
  workflow_dispatch:
permissions:
  contents: read
env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DANYPS5_RELINKER_ONLY=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - name: Install toolchain
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build python3
      - uses: actions/checkout@v7
      - run: cmake -S . -B build $CONFIGURE
      - run: cmake --build build --parallel 4
      - name: Test on native x86-64 and glibc 2.41
        run: |
          uname -m
          getconf GNU_LIBC_VERSION
          ctest --test-dir build --output-on-failure --timeout 30 --repeat until-fail:3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stack-header-linux-test-logs
          path: build/Testing/Temporary/
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - shell: cmd
        run: cmake -S . -B build %CONFIGURE%
      - shell: cmd
        run: cmake --build build
      - shell: cmd
        run: ctest --test-dir build --output-on-failure --timeout 30 --repeat until-fail:3
