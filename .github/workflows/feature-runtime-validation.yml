name: Foreign feature runtime probe
on:
  push:
    branches: [validation/feature-test-runtime]
    paths: [core/**, CMakeLists.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libvulkan1 mesa-vulkan-drivers
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: echo 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-feature-runtime
          restore-keys: |
            ${{ runner.os }}-
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_ENABLE_SPIRV_TOOLS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: python3 tools/check_test_registration.py build
      - run: cmake --build build --target agc_driver_flat_apertures_tests agc_driver_gpu_selected_buffer_format_tests agc_driver_tests agc_driver_buffer_format_tests agc_driver_bda_device_tests --parallel 3
      - name: Existing recompiler and buffer checks
        run: ctest --test-dir build -R '^agc_driver(_buffer_format|_bda_device)?$' --output-on-failure --timeout 30 --parallel 4
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          MESA_SHADER_CACHE_DISABLE: 'true'
      - name: Probe the largest format groups before the full table
        run: ctest --test-dir build --output-on-failure --timeout 30 --parallel 4 --repeat until-fail:3 -R '^agc_driver_gpu_selected_buffer_format_(0|1|97)$'
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          MESA_SHADER_CACHE_DISABLE: 'true'
      - name: Cold feature tests with strict runtime limits
        run: ctest --test-dir build --verbose --timeout 30 --parallel 4 --repeat until-fail:3 -L '^agc_driver_gpu_selected_buffer_format$' --output-log ctest.log
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          MESA_SHADER_CACHE_DISABLE: 'true'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: feature-runtime-${{ runner.os }}
          path: |
            ctest.log
            build/Testing/Temporary/LastTest.log
